# tmux colors, as user options for the rest of tmux's config to use.

# The blocks at either end of the bar, and the left one while panes are
# synchronized (an alert).
set -g @fg "color0"
set -g @accent "color4"
set -g @alert_fg "color0"
set -g @alert_bg "color1"

# The bar (the space after the tabs) and the window tabs: the active one stands
# out, and the others are muted.
set -g @bar_bg "#343746"
set -g @tab_active_fg "color0"
set -g @tab_active_bg "#909194"
set -g @tab_inactive_fg "#909194"
set -g @tab_inactive_bg "#424450"

# The pane borders (splits): the active pane's is the active tab's color.
set -g @border_bg "#282a36"
set -g @border_active "#909194"
set -g @border_inactive "#424450"

# Popups (e.g. the session picker): the panes' colors, with a border like the
# active pane's.
set -g @popup_fg "#f8f8f2"
set -g @popup_bg "#282a36"
set -g @popup_border "#909194"

# The current item in the pickers (e.g. the window tree) and menus, like the
# current item in zsh's completions and fzf.
set -g @current_fg "#f8f8f2"
set -g @current_bg "#424450"

# Selected text in copy mode: the background behind it, as the text keeps its
# own colors.
set -g @selection_bg "#44475a"

# Copy mode search matches, and the current match.
set -g @match_fg "color0"
set -g @match_bg "color11"
set -g @current_match_fg "color0"
set -g @current_match_bg "#ffb86c"

# The command prompt: while typing it's the text on the bar, so it reads as part
# of the bar, and in vi normal mode (after Esc) it's like the active tab.
set -g @prompt_fg "#f8f8f2"
set -g @prompt_bg "#343746"
set -g @prompt_normal_fg "color0"
set -g @prompt_normal_bg "#909194"
