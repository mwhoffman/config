# Kitty config.

# Use the mono version of JetBrainsMono for text.
font_family JetBrainsMono Nerd Font Mono
font_size 14.0

# Draw Nerd Font icons from the non-Mono Nerd Font. This allows for larger icons
# than the Mono variant---if these characters are followed by a space they are
# allowed to overlap into the following cell. Powerline separators and box
# drawing are left out, since they need to fill exactly one cell.
symbol_map U+E000-U+E00A JetBrainsMono Nerd Font
symbol_map U+E200-U+E2A9 JetBrainsMono Nerd Font
symbol_map U+E300-U+E3E3 JetBrainsMono Nerd Font
symbol_map U+E5FA-U+E6B7 JetBrainsMono Nerd Font
symbol_map U+E700-U+E8EF JetBrainsMono Nerd Font
symbol_map U+EA60-U+EC1E JetBrainsMono Nerd Font
symbol_map U+ED00-U+F2FF JetBrainsMono Nerd Font
symbol_map U+F300-U+F381 JetBrainsMono Nerd Font
symbol_map U+F400-U+F533,U+2665,U+26A1 JetBrainsMono Nerd Font
symbol_map U+F0001-U+F1AF0 JetBrainsMono Nerd Font
symbol_map U+23FB-U+23FE,U+2B58 JetBrainsMono Nerd Font

# Show ligatures as their separate characters when the cursor is on them.
disable_ligatures cursor

# Set the cursor to a vertical beam and don't blink.
cursor_shape beam
cursor_blink_interval 0

# Align tabs at the top (bold for the active tab), always show tabs, and use
# custom tabs that are set-up to look the same as my tmux tabs. The custom style
# is drawn by tab_bar.py in the kitty config directory.
tab_bar_edge top
tab_bar_min_tabs 1
active_tab_font_style bold
tab_bar_style custom

# Tweaks to make padding/margins as minimal as possible.
tab_bar_margin_width 4
tab_bar_margin_height 0 0
window_padding_width 0
window_margin_width 1 6 1

# Show a bell icon in the tab (controlled by the custom tab bar). Otherwise show
# no alerts but flash the screen for a tenth of a second.
enable_audio_bell no
window_alert_on_bell no
visual_bell_duration 0.1
bell_on_tab "󰂚 "

# Disable intrusive things.
allow_remote_control no
shell_integration disabled

# Never ask to close windows.
confirm_os_window_close 0

# Hide the mouse after 1s.
mouse_hide_wait 1

# Don't draw progress bars reported by programs with OSC 9;4 (e.g. nvim for
# LSP progress, which flashes on every save).
progress_bar hidden

# Open URLS whenever cmd-click is used, even in applications (e.g. nvim) that
# grab the mouse. Don't send these clicks through to grabbed applications.
mouse_map super+left click grabbed,ungrabbed mouse_click_url
mouse_map super+left press grabbed discard_event

# Detect urls, excluding angle brackets. Show with double-sized underline.
detect_urls yes
url_excluded_characters <>
url_style double

# Include my theme.
include theme.conf

# Include os-specific options.
include kitty.${KITTY_OS}.conf

