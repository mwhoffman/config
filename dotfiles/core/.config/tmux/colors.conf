# tmux colors, sourced by tmux.conf and used by status.conf.

# The blocks at either end of the bar, and alerts (e.g. synchronized panes).
set -g @fg "color0"
set -g @bg "color0"
set -g @accent "color4"
set -g @alert_fg "color1"
set -g @alert_bg "color1"

# The bar (the space after the tabs) and the window tabs: the active one stands
# out, and the others are muted.
set -g @bar_bg "#3c3836"
set -g @tab_active_fg "#282828"
set -g @tab_active_bg "#a89984"
set -g @tab_inactive_fg "#a89984"
set -g @tab_inactive_bg "#504945"

# The pane borders (splits). The active pane's border is the active tab's
# color.
set -g @border_bg "color0"
set -g @border_active "#a89984"
set -g @border_inactive "#665c54"

# Popups (e.g. the session picker): the panes' colors, with a border like the
# active pane's.
set -g @popup_fg "#ebdbb2"
set -g @popup_bg "color0"
set -g @popup_border "#a89984"

# Selections (e.g. in the window picker, copy mode and menus), like the active
# tab.
set -g @selection_fg "#282828"
set -g @selection_bg "#a89984"

# Copy mode search matches, and the current match.
set -g @match_fg "color0"
set -g @match_bg "color11"
set -g @current_match_fg "color0"
set -g @current_match_bg "#fe8019"

# The command prompt: while typing it's the text on the bar, so it reads as part
# of the bar, and in vi normal mode (after Esc) it's like the active tab.
set -g @prompt_fg "#ebdbb2"
set -g @prompt_bg "#3c3836"
set -g @prompt_normal_fg "#282828"
set -g @prompt_normal_bg "#a89984"
