# Generated by `bedeck build`.
# tmux colors, sourced by tmux.conf. These are based on the standard terminal
# colors.

set -g @fg "color0"
set -g @bg "color0"
set -g @accent "color4"
set -g @alert_fg "color1"
set -g @alert_bg "color1"
set -g @border_bg "color0"
set -g @border_active "color3"
set -g @border_inactive "color7"

# Window tabs, from gruvbox's palette: the active tab is like airline's current
# buffer (bg0 on fg3) and inactive tabs are like its other buffers (fg3 on
# bg2). TODO: generate these with bedeck.
set -g @tab_active_fg "#282828"
set -g @tab_active_bg "#a89984"
set -g @tab_inactive_fg "#a89984"
set -g @tab_inactive_bg "#504945"
