# Generated by `bedeck build`.
# tmux colors, sourced by tmux.conf. These are based on the standard terminal
# colors.

set -g @fg "color0"
set -g @bg "color0"
set -g @accent "color4"
set -g @alert_fg "color1"
set -g @alert_bg "color1"

# The bar and window tabs, from gruvbox's palette. The bar (the space after the
# tabs) is bg1, one step darker than inactive tabs. The active tab is like
# airline's current buffer (bg0 on fg3) and inactive tabs are like its other
# buffers (fg3 on bg2). TODO: generate these with bedeck.
set -g @bar_bg "#3c3836"
set -g @tab_active_fg "#282828"
set -g @tab_active_bg "#a89984"
set -g @tab_inactive_fg "#a89984"
set -g @tab_inactive_bg "#504945"

# The pane borders (splits), from gruvbox's palette. Inactive borders are bg3 on
# bg0, like nvim's WinSeparator, so tmux and nvim splits look the same. The
# active pane's border is fg3, the same color as the active tab. TODO: generate
# these with bedeck.
set -g @border_bg "#282828"
set -g @border_active "#a89984"
set -g @border_inactive "#665c54"

# Popups (e.g. the session picker), from gruvbox's palette: fg1 on bg0 like the
# panes, with a border like the active pane's. TODO: generate these with bedeck.
set -g @popup_fg "#ebdbb2"
set -g @popup_bg "#282828"
set -g @popup_border "#a89984"

# Selections, from gruvbox's palette: bg0 on fg3, like the active tab. TODO:
# generate these with bedeck.
set -g @selection_fg "#282828"
set -g @selection_bg "#a89984"

# Copy mode search matches, like nvim's Search (bg0 on bright yellow) and the
# current match like its CurSearch (bg0 on bright orange). TODO: generate these
# with bedeck.
set -g @match_fg "#282828"
set -g @match_bg "#fabd2f"
set -g @current_match_fg "#282828"
set -g @current_match_bg "#fe8019"

# The command prompt, from gruvbox's palette. While typing it's fg1 on the bar's
# bg1, so it reads as part of the bar. In vi normal mode (after Esc) it's like
# lualine's normal mode badge (bg0 on fg3). TODO: generate these with bedeck.
set -g @prompt_fg "#ebdbb2"
set -g @prompt_bg "#3c3836"
set -g @prompt_normal_fg "#282828"
set -g @prompt_normal_bg "#a89984"
