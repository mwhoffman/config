# The status bar: icons, the left/right blocks and the window tabs. Colors come
# from colors.conf, which must be sourced first.

# Set the icons and separators.
set -g @icon_tmux "󰞷"
set -g @icon_prefix "󰘴"
set -g @icon_scroll "󰋚"
set -g @icon_session "󰆍"
set -g @icon_zoomed "󰍅"
set -g @icon_marked "󰃀"
set -g @icon_bell "󰂚"
set -g @sep1 ""
set -g @sep2 ""

# Set the host icon based on the system type.
if-shell '[ "$(uname -s)" = "Linux"  ]' "set -g @icon_system "
if-shell '[ "$(uname -s)" = "Darwin" ]' "set -g @icon_system "

set -g pane-border-style "fg=#{@border_inactive} bg=#{@border_bg}"
set -g pane-active-border-style "fg=#{@border_active} bg=#{@border_bg} bold"

set -g status-style "bg=#{@bg}"
set -g window-status-bell-style ""
set -g window-status-separator ""

# Status icon on the left, which turns red while panes are synchronized. The
# separator's background matches the first tab, which is active or not. This
# keeps fg and bg in separate #[] since the color is a conditional.
set -g  @left_bg "#{?pane_synchronized,#{@alert_bg},#{@accent}}"
set -g  status-left ""
set -ga status-left "#[fg=#{@fg}]#[bg=#{E:@left_bg}] #{@icon_tmux} "
set -ga status-left "#[fg=#{E:@left_bg}]"
set -ga status-left "#{?#{e|==:#I,1},#[bg=#{@active_bg1}],#[bg=#{@inactive_bg1}]}#{@sep1}"

# The scroll position in copy/view mode, like vim's ruler: Bot at the bottom
# (copy_position is the number of lines up from it), Top at the top of the
# history, otherwise how far down the history the view is as a percentage. The
# % is written as %%%% since it goes through strftime twice (once for each
# level of #{E:} expansion), each of which turns %% into %.
set -g  @scroll_pos "#{?#{==:#{copy_position},0},Bot,"
set -ga @scroll_pos "#{?#{==:#{copy_position},#{copy_position_limit}},Top,"
set -ga @scroll_pos "#{e|/:#{e|*:#{e|-:#{copy_position_limit},#{copy_position}},100},"
set -ga @scroll_pos "#{copy_position_limit}}%%%%}}"

# The current mode, if any: the prefix being pressed (shown as an icon), or copy
# or view mode, which show the scroll position (see above). Other pane modes
# (tree, buffer, clock, ...) are obvious from the pane itself, so aren't shown.
# The prefix takes priority.
set -g  @scroll_mode "#{m/r:^(copy|view)-mode,#{pane_mode}}"
set -g  @mode_on "#{||:#{client_prefix},#{E:@scroll_mode}}"
set -g  @mode_name "#{?client_prefix,#{@icon_prefix},"
set -ga @mode_name "#{@icon_scroll} #{E:@scroll_pos}}"

# Don't show copy mode's position in the top right of the pane, since it's in
# the status bar instead (see above).
setw -g copy-mode-position-format ""

# Whether any other session has an alert (e.g. a bell in one of its windows).
# This loops over all sessions (S:), giving 1 for each one that has alerts and
# isn't this client's session, so it's empty if there are none. Alerts in this
# session are already shown on its window tabs.
set -g  @other_alerts "#{S:#{?#{&&:#{session_alerts},#{!=:#{session_name},#{client_session}}},1,}}"

# The mode (if there is one), a bell if other sessions have alerts (see above),
# session name and host on the right, separated by sep2. The session name is
# only shown if it isn't just a number (i.e. tmux's default naming). The match
# is for any non-digit, rather than ^[0-9]+$, since tmux expands $ in
# double-quoted strings.
set -g  status-right "#[bold]"
set -ga status-right "#[fg=#{@bg},bg=#{@accent}]#{@sep1}"
set -ga status-right "#[fg=#{@fg},bg=#{@accent}] "
set -ga status-right "#{?#{E:@mode_on},#{E:@mode_name} #{@sep2} ,}"
set -ga status-right "#{?#{E:@other_alerts},#{@icon_bell} #{@sep2} ,}"
set -ga status-right "#{@icon_session} #S #{@sep2} "
set -ga status-right "#{@icon_system} #h "

# Logical sections.
set -g @window_behind "#{e|<=:#I,#{e|-:#{active_window_index},2}}"
set -g @window_follow "#{&&:#{e|>:#I,#{active_window_index}},#{e|<:#I,#{last_window_index}}}"
set -g @window_other  "#{||:#{E:@window_behind},#{E:@window_follow}}"
set -g @window_last   "#{e|==:#I,#{last_window_index}}"
set -g @window_prev   "#{e|==:#I,#{e|-:#{active_window_index},1}}"

# The text portion of the active tab including a potential separator
# between num/txt. This doesn't check if the title is empty because we'll just
# skip this if it is empty.
set -g  @active_txt_maybe ""
set -ga @active_txt_maybe "#[fg=#{@active_bg1}]#[bg=#{@active_bg2}]#{@sep1}"
set -ga @active_txt_maybe "#[fg=#{@fg}]#[bg=#{@active_bg2}] #W "

# Background/foreground colors for the trailing sep, which depends on whether
# the text section is skipped or not.
set -g @active_sep_fg "#{?#W,#[fg=#{@active_bg2}],#[fg=#{@active_bg1}]}"
set -g @active_sep_bg "#{?#{E:@window_last},#[bg=#{@bg}],#[bg=#{@inactive_bg1}]}"

# Flags shown before a tab's number: whether the window is zoomed or holds the
# marked pane (see `prefix m`).
set -g  @flags "#{?window_zoomed_flag,#{@icon_zoomed} ,}"
set -ga @flags "#{?window_marked_flag,#{@icon_marked} ,}"

# The full num/text/sep sections.
set -g @active_num "#[bold,fg=#{@fg},bg=#{@active_bg1}] #{E:@flags}#I "
set -g @active_txt "#{?#W,#{E:@active_txt_maybe},}"
set -g @active_sep "#{E:@active_sep_fg}#{E:@active_sep_bg}#{@sep1}"

# Put the active tab together.
set -g window-status-current-format "#{E:@active_num}#{E:@active_txt}#{E:@active_sep}"

# The text portion of the inactive tab. See above.
set -g  @inactive_txt_maybe ""
set -ga @inactive_txt_maybe "#[fg=#{@inactive_bg1}]#[bg=#{@inactive_bg2}]#{@sep1}"
set -ga @inactive_txt_maybe "#[fg=#{@fg}]#[bg=#{@inactive_bg2}] #W "

# What to show if there's a bell.
set -g @bell "#{?window_bell_flag,#{@icon_bell} ,}"

# Construct the num/txt sections.
set -g @inactive_num "#[fg=#{@fg},bg=#{@inactive_bg1}] #{E:@bell}#{E:@flags}#I "
set -g @inactive_txt "#{?#W,#{E:@inactive_txt_maybe},}"

# Background for an inactive tab depends on if we're last, if we precede the
# active tab, or if we're any other tab (i.e. we have another inactive tab
# following).
set -g  @inactive_bg ""
set -ga @inactive_bg "#{?#{E:@window_last},#[bg=#{@bg}],}"
set -ga @inactive_bg "#{?#{E:@window_prev},#[bg=#{@active_bg1}],}"
set -ga @inactive_bg "#{?#{E:@window_other},#[bg=#{@inactive_bg1}],}"

# The foreground just depends on whether we're displaying the text or not
# (except for the "other" sep below).
set -g @inactive_fg "#{?#W,#[fg=#{@inactive_bg2}],#[fg=#{@inactive_bg1}]}"

# Display a standard sep if there's text and we're followed by an inactive tab,
# otherwise we'll just display a thin sep2.
set -g @inactive_sep_other "#{?#W,#{@sep1},#[fg=#{@fg}]#{@sep2}}"

# Put together the sep.
set -g  @inactive_sep ""
set -ga @inactive_sep "#{E:@inactive_bg}#{E:@inactive_fg}"
set -ga @inactive_sep "#{?#{E:@window_other},#{E:@inactive_sep_other},#{@sep1}}"

# Put together the inactive tab.
set -g window-status-format "#{E:@inactive_num}#{E:@inactive_txt}#{E:@inactive_sep}"
