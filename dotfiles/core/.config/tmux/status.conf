# The status bar: icons, the left/right blocks and the window tabs. Colors come
# from colors.conf, which must be sourced first.

# Set the icons and separators.
set -g @icon_tmux "󰞷"
set -g @icon_prefix "󰘴"
set -g @icon_scroll "󰋚"
set -g @icon_session "󰆍"
set -g @icon_zoomed "󰍅"
set -g @icon_marked "󰃀"
set -g @icon_bell "󰂚"
set -g @sep1 ""
set -g @sep2 ""

# Set the host icon based on the system type.
if-shell '[ "$(uname -s)" = "Linux"  ]' "set -g @icon_system "
if-shell '[ "$(uname -s)" = "Darwin" ]' "set -g @icon_system "

set -g pane-border-style "fg=#{@border_inactive} bg=#{@border_bg}"
set -g pane-active-border-style "fg=#{@border_active} bg=#{@border_bg} bold"
set -g popup-style "fg=#{@popup_fg} bg=#{@popup_bg}"
set -g popup-border-style "fg=#{@popup_border} bg=#{@popup_bg}"

# Selections (e.g. in the window picker, copy mode and menus) are the light
# color of the active tab and pane border, rather than yellow.
set -g mode-style "noattr fg=#{@selection_fg} bg=#{@selection_bg}"
set -g menu-selected-style "fg=#{@selection_fg} bg=#{@selection_bg}"

# Copy mode search matches, colored like nvim's.
set -g copy-mode-match-style "fg=#{@match_fg} bg=#{@match_bg}"
set -g copy-mode-current-match-style "fg=#{@current_match_fg} bg=#{@current_match_bg}"

set -g status-style "bg=#{@bar_bg}"
# tmux 3.8 underlines the active tab by default; its format styles it instead.
set -g window-status-current-style default
set -g window-status-bell-style ""
set -g window-status-separator ""

# The command prompt (and messages), and the prompt in vi normal mode. Like
# tmux's defaults, these fill the whole line except for pane and mode prompts.
set -g message-style "fg=#{@prompt_fg},bg=#{@prompt_bg},#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=#{@prompt_bg}}"
set -g message-command-style "fg=#{@prompt_normal_fg},bg=#{@prompt_normal_bg},#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=#{@prompt_normal_bg}}"

# A bar cursor while typing in the prompt and a block in vi normal mode, like
# vim. Neither blinks, matching the terminals' cursors. The vi normal mode
# option is new in tmux 3.8, so -q skips it quietly on older versions (which
# keep the bar).
set -g  prompt-cursor-style bar
set -gq prompt-command-cursor-style block

# Status icon on the left, which turns red while panes are synchronized. The
# separator's background matches the first tab, which is active or not. This
# keeps fg and bg in separate #[] since the color is a conditional.
set -g  @left_bg "#{?pane_synchronized,#{@alert_bg},#{@accent}}"
set -g  status-left ""
set -ga status-left "#[fg=#{@fg}]#[bg=#{E:@left_bg}] #{@icon_tmux} "
set -ga status-left "#[fg=#{E:@left_bg}]"
set -ga status-left "#{?window_start_flag,#[bg=#{@tab_active_bg}],#[bg=#{@tab_inactive_bg}]}#{@sep1}"

# The scroll position in copy/view mode, like vim's ruler: Bot at the bottom
# (copy_position is the number of lines up from it), Top at the top of the
# history, otherwise how far down the history the view is as a percentage. The
# % is written as %%%% since it goes through strftime twice (once for each
# level of #{E:} expansion), each of which turns %% into %.
set -g  @scroll_pos "#{?#{==:#{copy_position},0},Bot,"
set -ga @scroll_pos "#{?#{==:#{copy_position},#{copy_position_limit}},Top,"
set -ga @scroll_pos "#{e|/:#{e|*:#{e|-:#{copy_position_limit},#{copy_position}},100},"
set -ga @scroll_pos "#{copy_position_limit}}%%%%}}"

# The current mode, if any: the prefix being pressed (shown as an icon), or copy
# or view mode, which show the scroll position (see above). Other pane modes
# (tree, buffer, clock, ...) are obvious from the pane itself, so aren't shown.
# The prefix takes priority.
set -g  @scroll_mode "#{m/r:^(copy|view)-mode,#{pane_mode}}"
set -g  @mode_on "#{||:#{client_prefix},#{E:@scroll_mode}}"
set -g  @mode_name "#{?client_prefix,#{@icon_prefix},"
set -ga @mode_name "#{@icon_scroll} #{E:@scroll_pos}}"

# Don't show copy mode's position in the top right of the pane, since it's in
# the status bar instead (see above).
setw -g copy-mode-position-format ""

# Whether any session, including this one, has an alert (e.g. a bell in one of
# its windows). This loops over all sessions (S:), giving 1 for each one that
# has alerts, so it's empty if there are none.
set -g  @any_alerts "#{S:#{?session_alerts,1,}}"

# The mode (if there is one), a bell if any session has alerts (see above),
# session name and host on the right, separated by sep2. The session name is
# only shown if it isn't just a number (i.e. tmux's default naming). The match
# is for any non-digit, rather than ^[0-9]+$, since tmux expands $ in
# double-quoted strings.
#
# The sep2 between those sections is in the bar's color, like the sep1 before
# them.
#
# status-right-length is raised from its default of 40, which would cut off the
# end (e.g. the space after the host) with a long session name or a mode shown.
set -g  @right_sep "#[fg=#{@bar_bg}]#{@sep2}#[fg=#{@fg}]"
set -g  status-right-length 100
set -g  status-right "#[bold]"
set -ga status-right "#[fg=#{@bar_bg},bg=#{@accent}]#{@sep1}"
set -ga status-right "#[fg=#{@fg},bg=#{@accent}] "
set -ga status-right "#{?#{E:@mode_on},#{E:@mode_name} #{E:@right_sep} ,}"
set -ga status-right "#{?#{E:@any_alerts},#{@icon_bell} #{E:@right_sep} ,}"
set -ga status-right "#{@icon_session} #S #{E:@right_sep} "
set -ga status-right "#{@icon_system} #h "

# The window tabs, styled like the buffer tabs in gruvbox's vim screenshot
# (airline's tabline): each tab is a single color, the active one stands out
# and the others are muted, with an angled sep1 after each tab. Each tab is
# "N:name", or just "N" if the window has no name, and the active tab is bold.
# Before the number are icons for a bell, a zoomed window or the marked pane
# (see `prefix m`).
set -g  @tab_label "#{?window_bell_flag,#{@icon_bell} ,}"
set -ga @tab_label "#{?window_zoomed_flag,#{@icon_zoomed} ,}"
set -ga @tab_label "#{?window_marked_flag,#{@icon_marked} ,}"
set -ga @tab_label "#I#{?#W,:#W,}"

# The background after a tab, for its sep1: the bar if it's the last tab, the
# active tab's color if that's next, otherwise an inactive tab's color.
set -g  @next_active "#{e|==:#{e|+:#I,1},#{active_window_index}}"
set -g  @next_bg "#{?window_end_flag,#{@bar_bg},#{?#{E:@next_active},#{@tab_active_bg},#{@tab_inactive_bg}}}"

# The active tab.
set -g  window-status-current-format "#[bold]#[fg=#{@tab_active_fg}]#[bg=#{@tab_active_bg}] #{E:@tab_label} "
set -ga window-status-current-format "#[fg=#{@tab_active_bg}]#[bg=#{E:@next_bg}]#{@sep1}"

# An inactive tab. Between two inactive tabs, which are the same color, the
# separator is a thin sep2 in the bar's background color instead.
set -g  window-status-format "#[nobold]#[fg=#{@tab_inactive_fg}]#[bg=#{@tab_inactive_bg}] #{E:@tab_label} "
set -ga window-status-format "#{?#{||:#{window_end_flag},#{E:@next_active}},"
set -ga window-status-format "#[fg=#{@tab_inactive_bg}]#[bg=#{E:@next_bg}]#{@sep1},#[fg=#{@bar_bg}]#{@sep2}}"
