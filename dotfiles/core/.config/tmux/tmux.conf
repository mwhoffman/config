# Explicitly add terminal features: true color, curly/colored underlines (e.g.
# for nvim diagnostics), hyperlinks and extended keys. The latter lets keys like
# <C-CR> through to programs that ask for them.
set -ga terminal-features ',xterm-kitty:RGB:usstyle:hyperlinks:extkeys'
set -g extended-keys on
set -g default-terminal "tmux-256color"

# Standard settings.
set -g escape-time 10
set -g set-clipboard on
set -g focus-events on
set -g mouse on
set -g status-interval 1
set -g status-position bottom
set -g aggressive-resize on
set -g renumber-windows on
set -g history-limit 10000
set -g base-index 1
set -g pane-base-index 1
set -g automatic-rename on

# Name windows after the running command (e.g. "nvim", or "zsh" at the
# prompt), taken from the pane title, which zsh sets to "host: command" (see
# zsh/prompt.zsh). This removes everything up to the first space, i.e. the
# "host: " part; the pattern can't contain a ":" since tmux would take it as the
# end of the substitution. Titles not set by zsh without a space are kept as
# they are, except tmux's default title (the full host) which a new pane has
# until zsh's first prompt: that uses the running program instead, so the name
# doesn't flash to the host first. tmux names a window when its pane is created,
# before the pane's process has started the shell (so it's still "tmux"), and
# then not again until the pane prints something (zsh's first prompt), so
# "tmux" is replaced by the default shell's name (i.e. "zsh").
set -g @window_cmd "#{?#{==:#{pane_current_command},tmux},#{b:default-shell},#{pane_current_command}}"
set -g automatic-rename-format "#{?#{==:#{pane_title},#{host}},#{E:@window_cmd},#{s/^[^ ]* //:pane_title}}"

# Turn off alerts for activity. Leave the bell alone because we'll let the
# terminal take care of silencing that.
set -g monitor-activity off
set -g visual-activity off
set -g visual-silence off

# When a session is destroyed, switch to another one rather than detaching.
set -g detach-on-destroy off

# ---------------------------------------------------------------------------
# Keybindings.

# Miscellaneous keybindings.
bind r "source-file $HOME/.config/tmux/tmux.conf"

# Sessions: create a new one (asking for its name, then switching to it) with
# "S", and kill the current one (after confirming) with "X".
bind S command-prompt -p "new session:" { new-session -s "%%" }
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# Switch sessions with "s" by picking from fzf in a popup. Each line starts with
# the session's id (e.g. $1), which fzf hides and passes on to switch-client, so
# names with spaces or quotes are fine. After the name, the attached icon from
# status.conf (an eye) marks sessions a client is attached to (e.g. the current
# one), and sessions with an alert (e.g. a bell in one of their windows) get the
# bell icon.
# Escape closes the popup without switching.
bind s display-popup -E -w 50% -h 40% \
  "tmux list-sessions -F '#{session_id} #S#{?session_attached, #{@icon_attached},}#{?session_alerts, #{@icon_bell},}' \
   | fzf --reverse --with-nth 2.. --prompt 'session> ' \
   | cut -d' ' -f1 | xargs -r tmux switch-client -t"

# Switch windows (in any session) with "w", the same way. Each line is
# "session: name", or "session: [title]" if the window has no name, where the
# title is the window's active pane's title. The attached icon marks the window
# being shown in an attached session (e.g. the current window), and windows
# with a bell get the bell icon.
bind w display-popup -E -w 50% -h 40% \
  "tmux list-windows -a -F '#{window_id} #S: #{?#W,#W,[#{pane_title}]}#{?#{&&:#{window_active},#{session_attached}}, #{@icon_attached},}#{?window_bell_flag, #{@icon_bell},}' \
   | fzf --reverse --with-nth 2.. --prompt 'window> ' \
   | cut -d' ' -f1 | xargs -r tmux switch-client -t"

# Windows are numbered from 1 (see base-index), so "0" selects window 10, like
# the number keys on a keyboard, rather than the window 0 that never exists.
bind 0 select-window -t :=10

# Select panes using "hjkl".
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes using "HJKL".
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Use vi keys in copy mode, with v/y to select/copy like vim.
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Move up/down by half a page with c-k/c-j, as in nvim (and like c-u/c-d). This
# replaces c-j's default of copying, which Enter still does.
bind -T copy-mode-vi C-k send -X halfpage-up
bind -T copy-mode-vi C-j send -X halfpage-down

# ---------------------------------------------------------------------------
# Appearance: the theme colors, then the status bar that uses them.

# Draw tmux 3.8's theme colors (used by the defaults for e.g. the window picker,
# copy mode and menus) with the terminal's ANSI colors, so they follow its
# gruvbox palette like older tmux did. -q skips it on versions before 3.8.
set -sq theme terminal

source-file ~/.config/tmux/colors.conf
source-file ~/.config/tmux/status.conf
